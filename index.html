<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>虫虫精讀 · 英語課文本</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<header class="site"><div class="row">
  <img class="brand-logo" src="assets/logo.svg" alt="虫虫精讀">
  <h1>虫虫精讀 · 英語</h1>
  <a href="review.html">📅 復盤</a>
  <a href="voice.html">🔊 聲音</a>
  <a href="help.html">📖 說明</a>
  <a href="mountain.html">🏔️ 登山</a>
  <a href="jp/index.html">🎌 切換日語版</a>
</div></header>
<main>
  <a class="today-card" id="todayStatus" href="review.html" style="display:none"></a>
  <a class="climb-banner" id="climbBanner" href="mountain.html" style="display:none"></a>
  <a class="streak-chip" id="streakChip" href="report.html"></a>
  <div class="card" id="syncCard" style="display:none"></div>

  <a class="due-banner" id="addBanner" href="new.html" style="background:var(--teal);color:#fff"><span class="n">➕</span><span>拍照 / 粘貼一段課文，AI 自動做成精讀頁</span></a>

  <div id="searchBox" style="display:none;margin:14px 0 6px">
    <input type="text" id="lessonSearch" placeholder="🔍 搜尋課文（課名／中文意思）" autocomplete="off"
      style="width:100%;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:1rem;background:#fff;color:var(--ink);outline:none">
  </div>

  <h2 class="sec">課文列表</h2>
  <div id="lessonList"></div>
  <div id="userLessonList"></div>
  <p class="hint" id="searchEmpty" style="display:none">沒有符合的課文，換個關鍵字試試？</p>
</main>
<footer class="site">每天一點點，越背越輕鬆 🌱<br><span style="font-size:.78rem;opacity:.7">© 2026 iamamilycc · 虫虫精讀 jingdu · 保留一切權利</span><br><span style="font-size:.78rem"><a href="privacy.html" style="opacity:.85">隱私政策</a> · <a href="terms.html" style="opacity:.85">服務條款</a> · <span style="opacity:.6">版本 2026.07.29c</span></span></footer>

<script src="assets/core.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/generate.js"></script>
<script src="assets/lessons-registry.js"></script>
<script>
const LESSONS = [
  ...window.JD_LESSONS_EN
];

const SECS_KEYS = ['listen','read','vocab','grammar','build','speak','quiz','recite','make'];
const SEC_NAME = {listen:'聽全文',read:'逐句精讀',vocab:'生詞卡',grammar:'語法點',build:'連詞成句',speak:'跟讀',quiz:'聽力題',recite:'背句',make:'造句'};

/* 今日學習流：到期復盤 → 第一個沒學完的課(直達環節) → 全完成才推新課。孩子零選擇。 */
function firstUndone(id){ const p=JD.getProgress(id); return SECS_KEYS.find(k=>!p[k]); }
/* 算出「現在該做的下一步」（動作＋連結）。給合併後的今日卡用。 */
function todayNextStep(){
  const due = JD.dueItems().filter(it=>(it.lang||JD.langOf(it.lessonId))==='en').length;
  if(due>0) return { due:due, href:'review.html', act:'先復盤 <b>'+due+'</b> 句 —— 點我開始' };
  for(const l of LESSONS){
    const k=firstUndone(l.id);
    if(k) return { due:0, href:l.href+'?tab='+k, act:'繼續「'+JD.esc(l.en)+'」· '+SEC_NAME[k] };
  }
  const ul=Object.values(JDGen.allUserLessons()).filter(x=>x.lang==='en').sort((a,b)=>(a._meta?a._meta.created:0)-(b._meta?b._meta.created:0));
  for(const l of ul){
    const k=firstUndone(l.id);
    if(k) return { due:0, href:'lessons/view.html?id='+encodeURIComponent(l.id)+'&tab='+k, act:'繼續「'+JD.esc(l.title||'未命名')+'」· '+SEC_NAME[k] };
  }
  return { due:0, allDone:true, href:'new.html', act:'拍照 / 粘貼課文，加一課新的' };
}
/* 課名後的總評分小徽章（正確率+完成度，只在做過計分題後顯示） */
function scoreChip(id){
  const sc = JD.lessonScore(id);
  if(!sc.n || !sc.done) return '';
  const col = sc.accuracy>=85?'var(--teal-deep)':sc.accuracy>=60?'var(--mango)':'var(--coral)';
  return '<br><span class="zh" style="color:'+col+'">🎯 正確率 '+sc.accuracy+'% · 完成 '+sc.completion+'%</span>';
}
/* 家長鎖：strict 模式且英語有到期複習沒清完時，鎖住「加新課」與沒開始的新課 */
function gateDue(){ return JD.newLessonBlockedBy('en'); }
function applyGate(a, started){
  if(started || gateDue()<=0) return;
  a.href='review.html'; a.classList.add('locked');
  const pct=a.querySelector('.pct'); if(pct) pct.innerHTML='🔒 先複習';
}
function renderAddGate(){
  const b=document.getElementById('addBanner'); if(!b) return;
  const due=gateDue();
  if(due>0){ b.href='review.html'; b.style.background='var(--coral)';
    b.innerHTML='<span class="n">🔒</span><span>今天要先複習 <b style="font-size:1.2rem">'+due+'</b> 句，才能加新課 · 點我去複習</span>'; }
  else{ b.href='new.html'; b.style.background='var(--teal)';
    b.innerHTML='<span class="n">➕</span><span>拍照 / 粘貼一段課文，AI 自動做成精讀頁</span>'; }
}
const box = document.getElementById('lessonList');
LESSONS.forEach(l=>{
  const p = JD.getProgress(l.id);
  const doneCnt = SECS_KEYS.filter(k=>p[k]).length;
  const pct = Math.round(doneCnt/l.secs*100);
  const a = document.createElement('a');
  a.className='card lesson-item';
  a.href=l.href;
  a.innerHTML = '<span class="badge">'+l.num+'<small>'+l.badge+'</small></span>'+
    '<span class="t"><span class="en">'+l.en+'</span><br><span class="zh">'+l.zh+'</span>'+scoreChip(l.id)+'</span>'+
    '<span class="pct">'+(pct>=100?'✅ 完成':pct+'%')+'</span>';
  applyGate(a, doneCnt>0);
  box.appendChild(a);
});

/* 自建課文（本機/雲同步生成的英語課，lang==='en'） */
function renderUserLessons(){
  const ubox = document.getElementById('userLessonList'); ubox.innerHTML='';
  const all = Object.values(JDGen.allUserLessons()).filter(l=>l.lang==='en').sort((a,b)=>(b._meta?b._meta.created:0)-(a._meta?a._meta.created:0));
  if(!all.length) return;
  const h=document.createElement('h2'); h.className='sec'; h.textContent='我自己加的課'; ubox.appendChild(h);
  all.forEach(l=>{
    const p = JD.getProgress(l.id);
    const pct = Math.round(SECS_KEYS.filter(k=>p[k]).length/SECS_KEYS.length*100);
    const a=document.createElement('a'); a.className='card lesson-item'; a.href='lessons/view.html?id='+encodeURIComponent(l.id);
    a.innerHTML='<span class="badge" style="background:var(--mango);color:var(--ink)">自建<small>ENG</small></span>'+
      '<span class="t"><span class="en">'+JD.esc(l.title||'未命名')+'</span>'+
      (l.level?'<br><span class="zh nowrap">'+'★'.repeat(l.level)+'☆'.repeat(5-l.level)+' 難度</span>':'')+scoreChip(l.id)+'</span>'+
      '<span class="pct">'+(pct>=100?'✅':pct+'%')+'</span>';
    applyGate(a, SECS_KEYS.filter(k=>p[k]).length>0);
    const del=document.createElement('button');
    del.className='udel'; del.type='button'; del.textContent='🗑'; del.title='刪除這課';
    del.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      if(!confirm('確定刪除「'+(l.title||'未命名')+'」嗎？\n這課的進度和錯題復盤會一併清除，刪除後無法復原。')) return;
      JDGen.deleteLesson(l.id);
      renderUserLessons();
      refreshSearchVisibility();
    });
    a.appendChild(del);
    ubox.appendChild(a);
  });
}
function renderStreak(){
  const el=document.getElementById('streakChip'); if(!el) return;
  const st=JD.streak();
  el.innerHTML = st.todayDone ? '🔥 連續學習 <b>'+st.n+'</b> 天 · 看週報 →'
    : (st.n>0 ? '🌱 已連續 '+st.n+' 天，今天學一點就續上！ · 看週報 →' : '🌱 今天還沒開始學 · 看週報 →');
}
/* 今日一張卡（合併原「狀態卡」＋「今天的學習」動作條，避免兩塊各說一次造成重複）。
   一眼給家長看完成沒（顏色/emoji），同一張卡也是孩子零選擇的下一步（點就直達）。本頁＝英語版。 */
function renderTodayStatus(){
  const el=document.getElementById('todayStatus'); if(!el) return;
  const d=new Date(), todayKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const studied=!!(JD.daysMapLang('en')||{})[todayKey];
  const step=todayNextStep();
  el.style.display='flex'; el.classList.remove('done','partial','todo'); el.href=step.href;
  if(step.due>0){ el.classList.add('partial');
    el.innerHTML='<span class="big">📅</span><span class="t"><b>今日英語 · 先復盤</b><span class="sub">'+step.act+'</span></span>'; }
  else if(step.allDone){ el.classList.add('done');
    el.innerHTML='<span class="big">✅</span><span class="t"><b>今日英語 · 全部學完！</b><span class="sub">太棒了，今天可以放心休息 🎉</span></span>'; }
  else if(studied){ el.classList.add('done');
    el.innerHTML='<span class="big">✅</span><span class="t"><b>今日英語 · 今天學過了！</b><span class="sub">還想再練就點：'+step.act+'</span></span>'; }
  else { el.classList.add('todo');
    el.innerHTML='<span class="big">▶️</span><span class="t"><b>今日英語 · 開始學習</b><span class="sub">'+step.act+'</span></span>'; }
}
/* 登山橫幅：海拔>0 才顯示，爬向「你選的目標山」，與登山頁一致（原本顯示里程碑山，換目標不變） */
function renderClimb(){
  const el=document.getElementById('climbBanner'); if(!el) return;
  const ms=JD.mountainState(), M=JD.MOUNTAINS, tM=M[JD.getTargetMountain()], alt=ms.alt;
  if(alt<=0){ el.style.display='none'; return; }
  el.style.display='flex';
  const frac = tM.m>0 ? Math.max(0,Math.min(1,alt/tM.m)) : 1;
  const line = alt>=tM.m
    ? '🎉 已登上目標 <b>'+tM.emoji+' '+tM.name+'</b>！海拔 <b>'+alt+'米</b>'
    : '爬向 <b>'+tM.emoji+' '+tM.name+'</b> · 海拔 <b>'+alt+'米</b><br>'+
      '<span class="hint" style="margin:0">距登頂還有 '+(tM.m-alt)+' 米</span>'+
      '<div class="cb-bar"><i style="width:'+Math.round(frac*100)+'%"></i></div>';
  el.innerHTML = JD.avatarHTML(42)+'<span class="cb-txt">'+line+'</span><span style="align-self:center">›</span>';
}
/* 課文搜尋：課多了才顯示搜尋框，即時過濾內建課+自建課（比對課名英文/中文/難度徽章文字） */
function refreshSearchVisibility(){
  const n = document.querySelectorAll('#lessonList .lesson-item, #userLessonList .lesson-item').length;
  document.getElementById('searchBox').style.display = n > 4 ? 'block' : 'none';
}
function applySearch(){
  const q = (document.getElementById('lessonSearch').value||'').trim().toLowerCase();
  const items = document.querySelectorAll('#lessonList .lesson-item, #userLessonList .lesson-item');
  let shown = 0;
  items.forEach(el=>{
    const hit = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = hit ? '' : 'none';
    if(hit) shown++;
  });
  document.getElementById('searchEmpty').style.display = (q && shown===0) ? 'block' : 'none';
}
document.getElementById('lessonSearch').addEventListener('input', applySearch);

renderUserLessons();
renderTodayStatus();
renderStreak();
renderClimb();
renderAddGate();
refreshSearchVisibility();
window.JDSYNC_ONRESTORE = function(){ renderUserLessons(); renderTodayStatus(); renderStreak(); renderClimb(); renderAddGate(); refreshSearchVisibility(); }; /* 雲端同步回來後刷新 */
</script>
</body>
</html>
