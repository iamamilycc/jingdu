<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>復盤中心 · 日語精讀</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body>
<header class="site"><div class="row">
  <a href="index.html">← 目錄</a>
  <h1>📅 復盤中心</h1>
</div></header>
<main>
  <p class="hint" style="margin-top:4px">背錯的句子在這裡按「記憶最佳時間」排隊：30分鐘 → 1天 → 2天 → 4天 → 7天 → 15天 → 30天 → 90天。每個節點背到 85 分以上就晉一級，連過 8 級＝牢固 🏅</p>
  <p class="hint" style="margin-top:2px">🔒 想設「必須複習完才能上新課」的<b>家長鎖</b>？在 <a href="../report.html" style="color:var(--teal-deep);font-weight:600">學習報告</a> 頁最底的「家長設定」。</p>

  <div id="quizZone" style="display:none">
    <div class="stage">
      <div class="ring" id="qRing" style="display:none"></div>
      <div class="target" id="qTarget"></div>
      <div id="qBtns" style="margin-top:12px"></div>
      <div id="qResult" style="margin-top:14px"></div>
      <div class="heard" id="qHeard"></div>
    </div>
  </div>

  <h2 class="sec">⏰ 現在到期（<span id="dueCnt">0</span>）</h2>
  <div id="dueList"></div>

  <h2 class="sec" style="margin-top:26px">🗂️ 全部錯題</h2>
  <div id="allList"></div>
</main>
<footer class="site">按時復盤的句子，最不容易忘 🧠</footer>

<script src="../assets/core.js"></script>
<script src="../assets/tts.js"></script>
<script src="../assets/sync.js"></script>
<script>
const LANG='ja-JP';
const $ = s=>document.querySelector(s);
let cur=null, timer=null, recBusy=false;

function levelBar(lv){
  let h='<span class="lv">';
  for(let i=0;i<6;i++) h+='<i class="'+(i<lv?'on':'')+'"></i>';
  return h+'</span>';
}
function render(){
  const due = JD.dueItems().filter(it=>it.lessonId && it.lessonId.startsWith('jp-'));
  const all = JD.allItems().filter(it=>it.lessonId && it.lessonId.startsWith('jp-'));
  $('#dueCnt').textContent = due.length;
  const dl = $('#dueList'); dl.innerHTML='';
  if(!due.length) dl.innerHTML='<p class="empty">現在沒有到期的句子 🌿</p>';
  due.forEach(it=>{
    const d=document.createElement('div');
    d.className='card srs-item';
    const head = it.type==='word'
      ? '<b>🀄 '+JD.esc(it.zh)+'</b> <span style="color:var(--muted);font-size:.85rem">單詞 '+JD.esc(it.pos||'')+'</span>'
      : '<b class="jp-text">'+JD.esc(it.en)+'</b><br><span style="color:var(--muted);font-size:.85rem">'+JD.esc(it.zh)+'</span>';
    d.innerHTML='<div style="display:flex;align-items:center;gap:12px">'+
      '<div style="flex:1">'+head+levelBar(it.level)+'</div>'+
      '<button class="big-btn mango" style="padding:10px 20px">背它</button></div>';
    d.querySelector('button').onclick=()=>startQuiz(it);
    dl.appendChild(d);
  });
  const al = $('#allList'); al.innerHTML='';
  if(!all.length) al.innerHTML='<p class="empty">錯題本是空的——太厲害了吧！</p>';
  all.forEach(it=>{
    const d=document.createElement('div');
    d.className='card srs-item';
    const label = (it.type==='word' && !it.solid)
      ? '🀄 '+JD.esc(it.zh)+' <span style="color:var(--muted);font-size:.85rem">單詞 '+JD.esc(it.pos||'')+'</span>'
      : '<span class="jp-text">'+JD.esc(it.en)+'</span>';
    d.innerHTML='<div style="display:flex;align-items:center;gap:12px">'+
      '<div style="flex:1"><b>'+label+'</b>'+levelBar(it.level)+'</div>'+
      '<span style="font-family:var(--font-head);font-size:.82rem;color:'+(it.solid?'var(--green)':'var(--muted)')+'">'+
      (it.solid?'🏅 牢固':'下次：'+JD.fmtDue(it.due))+'</span></div>';
    al.appendChild(d);
  });
}

function startQuiz(it){
  cur=it; clearInterval(timer);
  $('#quizZone').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  if(it.type==='word'){
    /* 單詞復盤：看中文 → 打字拼出日語讀音（假名），與生詞卡同一種學法。
       原本用語音唸，單詞語音常辨識失敗會拼卻晉級不掉；打字＝確定性判斷，會拼就能晉級離開。 */
    $('#qRing').style.display='none';
    $('#qTarget').innerHTML='<div class="mask-box">🀄 「'+JD.esc(it.zh)+'」'+(it.pos?'（'+JD.esc(it.pos)+'）':'')+
      '<br>這個詞的日語讀音怎麼<b>拼</b>？打出假名</div>';
    $('#qResult').innerHTML=''; $('#qHeard').textContent='';
    $('#qBtns').innerHTML='<div class="vspell" style="justify-content:center;margin-bottom:10px">'+
        '<input id="qSpell" type="text" placeholder="輸入平假名讀音" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">'+
        '<button class="big-btn mango" onclick="qSpellCheck()">✓ 檢查</button></div>'+
      '<button class="big-btn ghost" onclick="qFail(true)">😳 忘了，看答案</button>';
    const inp=$('#qSpell'); if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); qSpellCheck(); } }); }
    return;
  }
  /* 背句復習：先讓使用者選「看幾秒」（沿用課文頁同一偏好鍵 jingdu_recite_sec2，兩處一致），再開始看題 */
  qReciteIdle();
}
/* 看題秒數：與日語課文頁背句同一機制與同一 localStorage 鍵（日語 auto=假名字數×0.5） */
function qSecMode(){ const v=localStorage.getItem('jingdu_recite_sec2'); return (v==='5'||v==='10'||v==='15')?v:'auto'; }
function qAutoSec(t){ const n=((t||'').replace(/\s/g,'')).length; return Math.max(4, Math.min(18, Math.round(n*0.5))); }
function qCurSec(){ const m=qSecMode(); return m==='auto' ? qAutoSec(cur.en) : parseInt(m,10); }
window.qSetSec = function(v){ localStorage.setItem('jingdu_recite_sec2', String(v)); try{ JD.touchSync&&JD.touchSync(); }catch(e){} qReciteIdle(); };
function qReciteIdle(){
  clearInterval(timer);
  $('#qRing').style.display='none';
  $('#qResult').innerHTML=''; $('#qHeard').textContent='';
  $('#qTarget').innerHTML='<div class="mask-box">準備好了就開始<br>先看幾秒，句子會蓋住，開口把它背出來！</div>';
  const sec=qCurSec(), mode=qSecMode();
  const opts=[['auto','自動'],['5','5秒'],['10','10秒'],['15','15秒']];
  const seg='<div class="rc-secsel">看幾秒：'+opts.map(o=>'<button class="rc-secbtn'+(o[0]===mode?' on':'')+'" onclick="qSetSec(\''+o[0]+'\')">'+o[1]+'</button>').join('')+
    (mode==='auto'?'<span class="hint" style="margin:6px 0 0;display:block">自動：這句約 '+sec+' 秒（依句子長短調整）</span>':'')+'</div>';
  $('#qBtns').innerHTML=seg+
    '<button class="big-btn mango" onclick="qStartPeek()">👀 開始看題（'+sec+' 秒）</button>'+
    '<button class="big-btn ghost" onclick="qDirect()">🎤 不看，直接背</button>';
}
window.qStartPeek = function(){
  const sec=qCurSec(); clearInterval(timer);
  $('#qTarget').innerHTML = '<span class="jp-text">'+JD.esc(cur.en)+'</span>';
  JD.speak(cur.en,false,LANG);
  $('#qResult').innerHTML=''; $('#qHeard').textContent='';
  const ring=$('#qRing'); ring.style.display='flex';
  $('#qBtns').innerHTML='';
  let left=sec; const C=2*Math.PI*30;
  ring.innerHTML='<svg width="66" height="66"><circle class="bg" cx="33" cy="33" r="30"/>'+
    '<circle class="fg" cx="33" cy="33" r="30" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg><span id="qSec">'+sec+'</span>';
  const fg=ring.querySelector('.fg');
  timer=setInterval(()=>{
    left--; $('#qSec').textContent=left;
    fg.style.strokeDashoffset=C*(sec-left)/sec;
    if(left<=0){ clearInterval(timer); mask(); }
  },1000);
};
window.qDirect = function(){ clearInterval(timer); mask(); };   /* 不看直接背：立即蓋住 */
function mask(){
  $('#qRing').style.display='none';
  $('#qTarget').innerHTML='<div class="mask-box">🙈 蓋住了！按麥克風背出來</div>';
  $('#qBtns').innerHTML='<button id="qRecBtn" class="big-btn rec" onclick="qRec()">🎙️ 開始背</button>'+
    '<button class="big-btn ghost" onclick="qFail(true)">😳 忘了，看答案</button>';
}
/* 發音評估四維條（複盤頁自己渲染） */
function pronBar(lb,val){ const col=val>=JD.PASS?'var(--green)':val>=60?'var(--mango)':'var(--coral)';
  return '<div style="display:flex;align-items:center;gap:9px;margin:5px 0"><span style="flex:none;width:3.6em;font-family:var(--font-head);font-weight:600;font-size:.9rem">'+lb+'</span>'+
    '<span style="flex:1;height:11px;border-radius:6px;background:var(--line);overflow:hidden"><span style="display:block;height:100%;width:'+val+'%;background:'+col+'"></span></span>'+
    '<span style="flex:none;width:2.2em;text-align:right;font-family:var(--font-head);font-weight:700">'+val+'</span></div>'; }
/* 複盤語音復習走 Azure 發音評估（與課文頁背句一致）；日語參考文用 cur.en（作者注音的假名讀音） */
function qRecPron(btn){
  const refText=cur.en;
  recBusy=true;
  $('#qResult').innerHTML='<div class="acc-badge">🎤 開麥克風中…允許後開口念，念完點「我說完了」</div>'; $('#qHeard').textContent='';
  let ctl=null, ended=false;
  btn.disabled=true; btn.classList.add('listening'); btn.textContent='⏳ 開麥克風…';
  JDPron.start(refText,'ja').then(c=>{ ctl=c; btn.disabled=false; btn.textContent='✅ 我說完了（上傳打分）'; })
    .catch(err=>{ recBusy=false; btn.classList.remove('listening'); btn.textContent='🎙️ 再試一次';
      $('#qResult').innerHTML='<div class="acc-badge bad">發音評估開麥克風失敗（'+JD.esc(err.message||err)+'）。可再試，或到聲音頁關掉發音評估用普通識別。</div>'; });
  btn.onclick=async()=>{
    if(ended||!ctl) return; ended=true; recBusy=false; btn.disabled=true; btn.classList.remove('listening'); btn.textContent='⏳ 評分中…';
    try{
      const sc=await ctl.stop();
      $('#qTarget').innerHTML='<span class="jp-text">'+JD.esc(cur.en)+'</span>';
      const low=sc.pron<JD.PASS;
      $('#qResult').innerHTML=pronBar('準確度',sc.accuracy)+pronBar('流利度',sc.fluency)+pronBar('完整度',sc.completeness)+(sc.hasProsody?pronBar('語調',sc.prosody):'')+
        '<div class="acc-badge '+(sc.pron>=JD.PASS?'good':'bad')+'">'+(sc.pron>=JD.PASS?'🎉':'💪')+' 綜合發音 '+sc.pron+' 分</div>'+
        (low?'<div style="margin-top:8px"><button class="big-btn teal jd-selfok">🙋 我確定念對了</button><button class="big-btn ghost jd-selffail" style="margin-left:6px">確實沒背對</button></div>':'');
      if(sc.text) $('#qHeard').textContent='你說的是：'+sc.text;
      btn.disabled=false; btn.textContent='🎙️ 再試一次'; btn.onclick=qRec;
      if(low){ const sp=$('#qResult').querySelector('.jd-selfok'); if(sp) sp.onclick=qPass; const sf=$('#qResult').querySelector('.jd-selffail'); if(sf) sf.onclick=qFail; }
      else qPass();
    }catch(e){ $('#qResult').innerHTML='<div class="acc-badge bad">發音評估暫時不可用（'+JD.esc(e.message||e)+'）</div>'; btn.disabled=false; btn.textContent='🎙️ 再試一次'; btn.onclick=qRec; }
  };
}
window.qRec = function(){
  const btn=$('#qRecBtn');
  if(recBusy) return;
  if(!JD.recSupported()){
    $('#qResult').innerHTML='<p style="margin-bottom:8px">此設備不支援語音識別，改用自評：</p>'+
      '<button class="big-btn teal" onclick="qPass()">✅ 背對了</button>'+
      '<button class="big-btn ghost" onclick="qFail()">❌ 沒背對</button>';
    $('#qTarget').innerHTML = '<span class="jp-text">'+JD.esc(cur.en)+'</span>';
    return;
  }
  /* 開了發音評估→走 Azure 四維評分（與課文頁背句一致）；沒開走瀏覽器識別＋準確率 */
  if(window.JDPron && JDPron.enabled() && JDPron.supported()){ return qRecPron(btn); }
  recBusy=true;
  btn.disabled=true; btn.classList.add('listening'); btn.textContent='👂 正在聽…';
  $('#qResult').innerHTML='<div class="acc-badge">👂 開始背吧！說完停一下，會自動結束打分</div>';
  JD.listen((text,err,alts)=>{
    recBusy=false;
    btn.disabled=false; btn.classList.remove('listening'); btn.textContent='🎙️ 再試一次';
    if(err && !text){
      const msg = err==='not-allowed'?'麥克風權限被拒絕：設定→Safari→麥克風':(err==='silence'?'沒聽到聲音，再大聲點':(err==='timeout'?'等了好久沒聽清，再按一次試試':(err==='aborted'?'剛剛還在聽呢～說完停頓一下會自動結束':'識別出錯，再試一次')));
      $('#qResult').innerHTML='<div class="acc-badge bad">'+msg+'</div>'; return;
    }
    /* 多候選 + 漢字表映射：對每個候選都用 compareJPReading(內含漢字↔假名)取最高分——與課文頁背句一致 */
    const cands=(alts&&alts.length)?alts:[text];
    const bc=JD.bestCompare(cands, c=>JD.compareJPReading(cur.en, c, cur.kmap||{}));
    const r=bc.r; text=bc.text||text;
    $('#qTarget').innerHTML = '<span class="jp-text">'+JD.esc(cur.en)+'</span>';
    const low = r.accuracy < JD.PASS;
    $('#qResult').innerHTML='<div class="result-words jp-text">'+r.tokens.map(t=>'<span class="rw '+t.st+'">'+JD.esc(t.w)+'</span>').join('')+'</div>'+
      '<div class="acc-badge '+(r.accuracy>=JD.PASS?'good':'bad')+'">'+(r.accuracy>=JD.PASS?'🎉':'💪')+' 準確率 '+r.accuracy+'%</div>'+
      (low?'<div style="margin-top:8px"><button class="big-btn teal jd-selfok">🙋 我確定念對了（有些詞語音聽不出）</button>'+
        '<button class="big-btn ghost jd-selffail" style="margin-left:6px">確實沒背對</button>'+
        '<div class="hint" style="margin:6px 0 0">想更準確評分：到「🔊 聲音」頁開「🎯 發音評估」。</div></div>':'');
    $('#qHeard').textContent='你說的是：'+text;
    if(low){
      const sp=$('#qResult').querySelector('.jd-selfok'); if(sp) sp.onclick=qPass;
      const sf=$('#qResult').querySelector('.jd-selffail'); if(sf) sf.onclick=qFail;
    } else { qPass(); }
  }, undefined, LANG);
};
/* 單詞復盤打字判分：與日語生詞卡同一比對(片假名→平假名正規化 kk2hh、去空白、完全相同)。對→晉級，錯→顯示正解並打回 */
window.qSpellCheck = function(){
  const inp=$('#qSpell'); if(!inp) return;
  const raw=(inp.value||'').trim();
  if(!raw){ inp.focus(); return; }
  const got=JD.kk2hh(raw).replace(/\s/g,'');
  const want=JD.kk2hh(cur.en||'').replace(/\s/g,'');
  $('#qTarget').innerHTML = '<span class="jp-text">'+JD.esc(cur.en)+'</span>';
  if(got===want){
    $('#qResult').innerHTML='<div class="acc-badge good">🎉 拼對了！<b>'+JD.esc(cur.en)+'</b></div>';
    JD.speak(cur.en,false,LANG); qPass();
  } else {
    $('#qResult').innerHTML='<div class="acc-badge bad">✗ 正確讀音：<b>'+JD.esc(cur.en)+'</b></div>';
    qFail();
  }
};
window.qPass = function(){
  JD.reviewPass(cur.id);
  $('#qBtns').innerHTML='<div class="acc-badge good">⬆️ 晉級成功！下次復盤：'+JD.fmtDue(JD.getBook()[cur.id].due)+'</div>'+
    '<div><button class="big-btn teal" onclick="closeQuiz()">繼續 →</button></div>';
  render();
};
window.qFail = function(showAns){
  JD.reviewFail(cur.id);
  if(showAns) $('#qTarget').innerHTML = '<span class="jp-text">'+JD.esc(cur.en)+'</span>';
  $('#qBtns').innerHTML='<div class="acc-badge bad">回到第一級，30 分鐘後再戰 💪</div>'+
    '<div><button class="big-btn teal" onclick="closeQuiz()">繼續 →</button></div>';
  render();
};
window.closeQuiz = function(){ $('#quizZone').style.display='none'; cur=null; };

render();
</script>
</body>
</html>
